<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jason Jay Gurang — software developer and licensed electronics engineer building full-stack web apps and the systems behind them."
    />
    <meta name="theme-color" content="#FAF5EC" />

    <!-- Link previews (LinkedIn, Facebook, Messenger, X). Set VITE_SITE_URL in .env -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeeJayJay" />
    <meta property="og:title" content="Jason Jay Gurang — Software Developer" />
    <meta
      property="og:description"
      content="Painter and builder: full-stack web apps and the systems behind them."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Painted portrait of Jason Jay Gurang beside his name" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jason Jay Gurang — Software Developer" />
    <meta
      name="twitter:description"
      content="Painter and builder: full-stack web apps and the systems behind them."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/profile-light.png" />
    <link rel="preload" as="image" href="/profile-dark.png" />
    <title>GeeJayJay</title>
    <script>
      // Apply the saved persona before first paint to avoid a flash.
      try {
        if (localStorage.getItem("portfolio-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/App.tsx"></script>
  </body>
</html>
